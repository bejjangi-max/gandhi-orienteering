<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>간디엔티어링 인증</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f0f7e6;min-height:100vh;max-width:480px;margin:0 auto;}

header{background:linear-gradient(135deg,#1a5c1a,#3a8c3a);color:#fff;text-align:center;padding:16px 16px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
header h1{font-size:1.15em;font-weight:800;}
header p{font-size:0.75em;opacity:0.85;margin-top:3px;}

.card{background:#fff;border-radius:14px;padding:16px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,0.07);}
.card h3{font-size:0.9em;color:#1a5c1a;font-weight:700;margin-bottom:10px;}

.post-hero{background:linear-gradient(135deg,#1a5c1a,#3a8c3a);color:#fff;border-radius:16px;margin:12px;padding:20px;text-align:center;}
.post-hero .num{font-size:3em;font-weight:900;line-height:1;}
.post-hero .pts{font-size:1.1em;font-weight:700;margin-top:4px;opacity:0.9;}
.post-hero .loc{font-size:0.78em;opacity:0.8;margin-top:6px;}
.diff-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:0.72em;font-weight:700;margin-top:6px;background:rgba(255,255,255,0.25);color:#fff;}

.post-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.pg-item{background:#f8f8f8;border:2px solid #ddd;border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;transition:all 0.15s;}
.pg-item.sel{background:#e6f4e6;border-color:#1a5c1a;}
.pg-item .pn{font-size:1em;font-weight:800;color:#333;}
.pg-item.sel .pn{color:#1a5c1a;}
.pg-item .pp{font-size:0.62em;color:#e67e22;font-weight:700;}

select{width:100%;padding:12px;border:1.5px solid #ccc;border-radius:10px;font-size:0.95em;background:#fff;outline:none;}
select:focus{border-color:#3a8c3a;}

.photo-zone{border:2.5px dashed #aad4aa;border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;background:#fafff8;position:relative;}
.photo-zone .icon{font-size:2.8em;}
.photo-zone p{font-size:0.8em;color:#666;margin-top:8px;line-height:1.5;}
.photo-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
#preview{width:100%;border-radius:10px;margin-top:10px;display:none;max-height:280px;object-fit:cover;}

.warn{font-size:0.75em;color:#e74c3c;background:#fff5f5;border:1px solid #fcc;border-radius:8px;padding:8px 10px;margin-bottom:10px;}

.btn-submit{width:100%;padding:16px;background:linear-gradient(135deg,#1a5c1a,#3a8c3a);color:#fff;border:none;border-radius:14px;font-size:1.05em;font-weight:800;cursor:pointer;margin-top:4px;}
.btn-submit:active{opacity:0.85;}
.btn-submit:disabled{opacity:0.45;cursor:not-allowed;}

.err-msg{background:#fff5f5;border:1.5px solid #fcc;border-radius:10px;padding:12px;font-size:0.82em;color:#c0392b;margin-top:10px;display:none;}

/* 로딩 */
#loadingArea{display:none;text-align:center;padding:60px 20px;}
.spinner{width:40px;height:40px;border:4px solid #ddd;border-top-color:#3a8c3a;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}

/* 성공 */
#successArea{display:none;text-align:center;padding:40px 20px;}
#successArea .big{font-size:4em;}
#successArea h2{color:#1a5c1a;font-size:1.3em;margin-top:10px;font-weight:800;}
#successArea p{font-size:0.88em;color:#555;margin-top:10px;line-height:1.8;}
.btn-again{margin-top:24px;padding:13px 30px;background:#1a5c1a;color:#fff;border:none;border-radius:12px;font-size:0.95em;font-weight:700;cursor:pointer;display:inline-block;}

.mode-bar{display:flex;gap:8px;margin:12px;background:#fff;border-radius:12px;padding:8px;box-shadow:0 1px 4px rgba(0,0,0,0.07);}
.mode-btn{flex:1;padding:9px;border:none;border-radius:8px;font-size:0.82em;font-weight:700;cursor:pointer;background:#f5f5f5;color:#666;}
.mode-btn.active{background:#1a5c1a;color:#fff;}
</style>
</head>
<body>

<header>
  <h1>🕊️ 간디엔티어링 포스트 인증</h1>
  <p>2026 제천간디학교 대동제 · 5월 24일</p>
</header>

<!-- 메인 앱 -->
<div id="mainArea">
  <div id="qrMode">
    <div class="post-hero" id="postHero" style="display:none;"></div>
    <div class="card" id="noPostCard">
      <h3>⚠️ 포스트 정보 없음</h3>
      <p style="font-size:0.82em;color:#666;line-height:1.6;">QR코드를 스캔해서 접속해주세요.</p>
    </div>
  </div>

  <div id="formArea" style="display:none;">
    <div class="card">
      <h3>👥 우리 팀 선택</h3>
      <select id="teamSel">
        <option value="">-- 팀을 선택하세요 --</option>
        <option>권수한무A</option><option>권수한무B</option><option>권수한무C</option><option>권수한무D</option>
        <option>령역전개A</option><option>령역전개B</option><option>령역전개C</option><option>령역전개D</option>
        <option>승호잇짜A</option><option>승호잇짜B</option><option>승호잇짜C</option><option>승호잇짜D</option>
        <option>양과사는남자A</option><option>양과사는남자B</option><option>양과사는남자C</option><option>양과사는남자D</option>
        <option>이정상회담A</option><option>이정상회담B</option><option>이정상회담C</option><option>이정상회담D</option>
        <option>정이팡팡A</option><option>정이팡팡B</option><option>정이팡팡C</option><option>정이팡팡D</option>
        <option>주전부리A</option><option>주전부리B</option><option>주전부리C</option><option>주전부리D</option>
        <option>현영이맘에저장A</option><option>현영이맘에저장B</option><option>현영이맘에저장C</option><option>현영이맘에저장D</option>
        <option>오륙도A</option><option>오륙도B</option><option>오륙도C</option><option>오륙도D</option><option>오륙도E</option>
        <option>졸업생</option>
        <option>동문회</option>
      </select>
    </div>

    <div class="card">
      <h3>📷 인증 사진</h3>
      <p class="warn">⚠️ 플래그와 팀원 전원 얼굴이 모두 나와야 해요!</p>
      <div class="photo-zone" id="photoZone">
        <div class="icon">📷</div>
        <p>여기를 눌러 사진 촬영 또는 선택<br><span style="font-size:0.85em;color:#aaa;">플래그 + 팀원 전원 포함</span></p>
        <input type="file" id="fileInput" accept="image/*" capture="environment" onchange="onPhoto(event)">
        <img id="preview" alt="미리보기">
      </div>
    </div>

    <div style="margin:0 12px 30px;">
      <div class="err-msg" id="errMsg"></div>
      <button class="btn-submit" id="submitBtn" onclick="doSubmit()">🚩 인증 제출하기</button>
    </div>
  </div>
</div>

<!-- 로딩 -->
<div id="loadingArea">
  <div class="spinner"></div>
  <p style="font-size:0.85em;color:#555;">인증 중... 잠시만 기다려주세요</p>
</div>

<!-- 성공 -->
<div id="successArea">
  <div class="big">🎉</div>
  <h2>인증이 완료되었습니다.</h2>
  <p id="successMsg"></p>

</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbygy0yO2WeobQck3p5V8lzEmQzlUNGGjiFubfJGWVfMKEIfyOUiHvCJdhbKkNUNu3hpLg/exec';

function getDiff(pts){
  if(pts>=50)return'최상';if(pts>=40)return'상';if(pts>=30)return'중상';if(pts>=20)return'중';return'하';
}
const diffEmoji={'하':'🟢','중':'🟡','중상':'🟠','상':'🔴','최상':'🟣'};

const posts=[
  {n:1,loc:"장학카페 창고 컨테이너 우측벽",pts:10},
  {n:2,loc:"크당 뒤편 나무기둥",pts:10},
  {n:3,loc:"학생회 컨테이너 앞 학교간판",pts:10},
  {n:4,loc:"크당입구 신발장 우측 끝",pts:10},
  {n:5,loc:"학교 좌측 측면 벽",pts:10},
  {n:6,loc:"학교건물 뒤편 기둥",pts:20},
  {n:7,loc:"학교 우측 식당 쪽 지붕 끝",pts:10},
  {n:8,loc:"학교 중앙 건물 뒤 소나무",pts:20},
  {n:9,loc:"작당 입구 문고리",pts:20},
  {n:10,loc:"작당 앞건물 통로",pts:20},
  {n:11,loc:"운동장 컨테이너 농구대 기둥",pts:10},
  {n:12,loc:"경로당 모퉁이 스텐기둥",pts:20},
  {n:13,loc:"경로당 정자 기둥",pts:20},
  {n:14,loc:"마을 골목 전봇대 기둥",pts:20},
  {n:15,loc:"마을 도로 천변 기둥",pts:20},
  {n:16,loc:"웃말교 건너 우측 전봇대",pts:30},
  {n:17,loc:"16번 우측 천변 분전반",pts:30},
  {n:18,loc:"선고교 좌측 정자 기둥",pts:30},
  {n:19,loc:"선고교 건너 좌측 도로 전봇대",pts:40},
  {n:20,loc:"맑은이네 집 전봇대(도로쪽)",pts:40},
  {n:21,loc:"바위솔카페 뒤편 건물",pts:50},
  {n:22,loc:"보안등 전봇대",pts:40},
  {n:23,loc:"웃말교 우측 둑방길 고춧대(녹색 울타리)",pts:50},
  {n:24,loc:"웃말교 우측 둑방길 고춧대 기둥",pts:40},
  {n:25,loc:"둑방길 끝 비포장길 나무(정면)",pts:60},
  {n:26,loc:"학교입구 우측 고목",pts:20},
  {n:27,loc:"학교입구 도로 도요타 중장비",pts:30},
  {n:28,loc:"마을 선고교 건너 뚝방 전봇대",pts:30},
  {n:29,loc:"퇴골교 지나 우측 전봇대",pts:30},
  {n:30,loc:"정류장 맞은편 창고 끝",pts:30},
  {n:31,loc:"선생님 댁 대문기둥",pts:40},
  {n:32,loc:"하늘마루 무대 철제 기둥",pts:60},
  {n:33,loc:"폐기물 울타리",pts:50},
].map(p=>({...p,diff:getDiff(p.pts)}));

let selPost=null, photoData=null, mode='qr';

function show(id){
  ['mainArea','loadingArea','successArea'].forEach(x=>{
    document.getElementById(x).style.display = x===id ? 'block' : 'none';
  });
}

function getURLPost(){
  return parseInt(new URLSearchParams(window.location.search).get('post'))||null;
}

function renderHero(p,elId){
  const el=document.getElementById(elId);
  el.style.display='block';
  el.innerHTML=`<div class="num">No.${p.n}</div><div class="pts">🏅 ${p.pts}점</div><div class="loc">📍 ${p.loc}</div><span class="diff-badge">${diffEmoji[p.diff]||''} 난이도 ${p.diff}</span>`;
}

function setPost(num){
  const p=posts.find(x=>x.n===num);
  if(!p)return;
  selPost=p;
  document.getElementById('formArea').style.display='block';
  if(mode==='qr') renderHero(p,'postHero');
  else{
    renderHero(p,'postHeroManual');
    document.querySelectorAll('.pg-item').forEach(el=>el.classList.toggle('sel',parseInt(el.dataset.n)===num));
  }
}

function setMode(m){
  mode=m;
  document.getElementById('btnQR').classList.toggle('active',m==='qr');
  document.getElementById('btnManual').classList.toggle('active',m==='manual');
  document.getElementById('qrMode').style.display=m==='qr'?'block':'none';
  document.getElementById('manualMode').style.display=m==='manual'?'block':'none';
  document.getElementById('formArea').style.display='none';
  selPost=null;
}

function buildGrid(){
  const g=document.getElementById('postGrid');
  posts.forEach(p=>{
    const el=document.createElement('div');
    el.className='pg-item'; el.dataset.n=p.n;
    el.innerHTML=`<div class="pn">${p.n}</div><div class="pp">${p.pts}pt</div>`;
    el.onclick=()=>setPost(p.n);
    g.appendChild(el);
  });
}

function onPhoto(e){
  const file=e.target.files[0];
  if(!file)return;
  if(file.size>5*1024*1024){showErr('사진 용량이 너무 커요. 카메라 해상도를 낮춰서 다시 찍어주세요.');return;}
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const canvas=document.createElement('canvas');
        const MAX=800;
        let w=img.width,h=img.height;
        if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}
        else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        photoData=canvas.toDataURL('image/jpeg',0.7);
        canvas.width=0; canvas.height=0;
        const prev=document.getElementById('preview');
        prev.src=photoData; prev.style.display='block';
        document.getElementById('photoZone').querySelector('p').style.display='none';
        document.getElementById('photoZone').querySelector('.icon').style.display='none';
      }catch(err){showErr('사진 처리 중 오류가 났어요. 다시 시도해주세요.');}
    };
    img.onerror=()=>showErr('사진을 불러올 수 없어요.');
    img.src=ev.target.result;
  };
  reader.onerror=()=>showErr('사진 읽기 오류. 다시 시도해주세요.');
  reader.readAsDataURL(file);
}

async function doSubmit(){
  const team=document.getElementById('teamSel').value;
  document.getElementById('errMsg').style.display='none';
  if(!selPost){showErr('포스트를 선택해주세요!');return;}
  if(!team){showErr('팀을 선택해주세요!');return;}
  if(!photoData){showErr('인증 사진을 올려주세요!');return;}

  show('loadingArea');

  try{
    const resp=await fetch(GAS_URL,{
      method:'POST',
      body:JSON.stringify({action:'submit',team,postNum:selPost.n,postPts:selPost.pts,photoBase64:photoData})
    });
    const data=await resp.json();
    if(data.success){
      document.getElementById('successMsg').innerHTML=
        `<b>${team}</b> 팀<br>No.${selPost.n} 포스트 인증 완료!<br><b style="color:#1a5c1a;font-size:1.1em;">+${selPost.pts}점 획득! 🎯</b>`;
      show('successArea');
    }else{
      show('mainArea');
      showErr(data.message||'오류가 발생했어요. 다시 시도해주세요.');
    }
  }catch(e){
    show('mainArea');
    showErr('서버 연결 오류. 인터넷 연결을 확인해주세요.');
  }
}

function showErr(msg){
  const el=document.getElementById('errMsg');
  el.textContent='⚠️ '+msg;
  el.style.display='block';
  el.scrollIntoView({behavior:'smooth'});
}

function resetAll(){
  selPost=null; photoData=null;
  document.getElementById('teamSel').value='';
  document.getElementById('preview').style.display='none';
  document.getElementById('preview').src='';
  document.getElementById('fileInput').value='';
  document.getElementById('formArea').style.display='none';
  document.getElementById('postHeroManual').style.display='none';
  document.getElementById('errMsg').style.display='none';
  document.getElementById('photoZone').querySelector('p').style.display='block';
  document.getElementById('photoZone').querySelector('.icon').style.display='block';
  document.querySelectorAll('.pg-item').forEach(el=>el.classList.remove('sel'));
  show('mainArea');
  const urlPost=getURLPost();
  if(urlPost) setPost(urlPost);
}

// 초기화
buildGrid();
show('mainArea');
const urlPost=getURLPost();
if(urlPost){
  document.getElementById('noPostCard').style.display='none';
  document.getElementById('modeBar').style.display='none';
  setPost(urlPost);
}
</script>
</body>
</html>
